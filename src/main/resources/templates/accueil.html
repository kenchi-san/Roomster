<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Roomster - Accueil</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="min-h-screen bg-slate-50">
<header th:replace="~{fragments/nav :: nav}"></header>

<main class="mx-auto max-w-3xl px-4 py-16">
    <h1 class="text-3xl font-bold text-slate-900">Bienvenue sur Roomster</h1>
    <p class="mt-2 text-slate-500">Accédez rapidement à vos outils de gestion.</p>

    <div class="mt-10 grid gap-4 sm:grid-cols-3">
        <a th:href="@{/liste-employe}"
           class="group rounded-xl border border-slate-200 bg-white p-6 shadow-sm transition hover:-translate-y-0.5 hover:border-slate-300 hover:shadow-md">
            <h2 class="font-semibold text-slate-900 group-hover:text-slate-700">Liste des employés</h2>
            <p class="mt-1 text-sm text-slate-500">Consulter, modifier ou supprimer un employé.</p>
        </a>
        <a th:href="@{/ajout-employe}"
           class="group rounded-xl border border-slate-200 bg-white p-6 shadow-sm transition hover:-translate-y-0.5 hover:border-slate-300 hover:shadow-md">
            <h2 class="font-semibold text-slate-900 group-hover:text-slate-700">Ajouter un employé</h2>
            <p class="mt-1 text-sm text-slate-500">Créer une nouvelle fiche employé.</p>
        </a>
        <a th:href="@{/conge-paye}"
           class="group rounded-xl border border-slate-200 bg-white p-6 shadow-sm transition hover:-translate-y-0.5 hover:border-slate-300 hover:shadow-md">
            <h2 class="font-semibold text-slate-900 group-hover:text-slate-700">Congés payés</h2>
            <p class="mt-1 text-sm text-slate-500">Voir les compteurs CP / RTT.</p>
        </a>
    </div>
</main>
</body>
</html>
