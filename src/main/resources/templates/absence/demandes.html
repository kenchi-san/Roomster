<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Demandes d'absence</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-slate-50">
<div class="flex min-h-screen">
<aside th:replace="~{fragments/nav :: nav}"></aside>

<main class="mx-auto max-w-6xl flex-1 px-4 py-8">
    <h1 class="text-2xl font-bold text-slate-900">Demandes d'absence</h1>

    <div th:replace="~{fragments/messages :: messages}"></div>

    <!-- En attente de validation -->
    <h2 class="mt-8 text-xl font-bold text-slate-900" th:text="'En attente (' + ${enAttente.size()} + ')'"></h2>
    <div class="mt-4 overflow-x-auto rounded-xl border border-slate-200 bg-white shadow-sm">
        <table class="min-w-full divide-y divide-slate-200 text-sm">
            <thead class="bg-slate-50">
            <tr>
                <th scope="col" class="px-4 py-3 text-left font-semibold text-slate-600">Employé</th>
                <th scope="col" class="px-4 py-3 text-left font-semibold text-slate-600">Type</th>
                <th scope="col" class="px-4 py-3 text-left font-semibold text-slate-600">Période</th>
                <th scope="col" class="px-4 py-3 text-left font-semibold text-slate-600">Décision</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="d : ${enAttente}">
                <td class="px-4 py-3 text-slate-900" th:text="${d.employe.user.prenom + ' ' + d.employe.user.nom}"></td>
                <td class="px-4 py-3 text-slate-600" th:text="${d.type.libelle}"></td>
                <td class="px-4 py-3 text-slate-600" th:text="${d.periode}"></td>
                <td class="px-4 py-3">
                    <div class="flex flex-wrap items-center gap-2">
                        <form th:action="@{/demandes/{id}/valider(id=${d.id})}" method="post">
                            <button type="submit" class="rounded-md bg-emerald-600 px-3 py-1 text-xs font-medium text-white transition hover:bg-emerald-500">Valider</button>
                        </form>
                        <form th:action="@{/demandes/{id}/refuser(id=${d.id})}" method="post" class="flex gap-2">
                            <input type="text" name="motif" required placeholder="Motif du refus (obligatoire)"
                                   class="w-56 rounded-md border border-slate-300 px-2 py-1 text-xs focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500">
                            <button type="submit" class="rounded-md px-3 py-1 text-xs font-medium text-red-600 transition hover:bg-red-50">Refuser</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${enAttente.isEmpty()}">
                <td class="px-4 py-3 text-slate-400" colspan="4">Aucune demande en attente.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Saisie d'un arrêt maladie par le manager -->
    <h2 class="mt-10 text-xl font-bold text-slate-900">Déclarer un arrêt maladie</h2>
    <form th:action="@{/demandes/maladie}" method="post"
          class="mt-4 grid gap-4 rounded-xl border border-slate-200 bg-white p-6 shadow-sm sm:grid-cols-4 sm:items-end">
        <div>
            <label for="employeId" class="block text-sm font-medium text-slate-700">Employé</label>
            <select id="employeId" name="employeId" required
                    class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500">
                <option th:each="e : ${employes}" th:value="${e.id}" th:text="${e.user.prenom + ' ' + e.user.nom}"></option>
            </select>
        </div>
        <div>
            <label for="debut" class="block text-sm font-medium text-slate-700">Du</label>
            <input type="date" id="debut" name="debut" required
                   class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500">
        </div>
        <div>
            <label for="fin" class="block text-sm font-medium text-slate-700">Au (inclus)</label>
            <input type="date" id="fin" name="fin" required
                   class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500">
        </div>
        <button type="submit"
                class="rounded-md bg-slate-900 px-4 py-2 text-sm font-medium text-white transition hover:bg-slate-700">
            Enregistrer
        </button>
        <p class="text-xs text-slate-500 sm:col-span-4">
            Peut être saisi après coup. L'arrêt est validé directement et ne débite aucun compteur (justificatif géré hors application).
        </p>
    </form>

    <!-- Déjà traitées -->
    <h2 class="mt-10 text-xl font-bold text-slate-900">Dernières demandes traitées</h2>
    <div class="mt-4 overflow-x-auto rounded-xl border border-slate-200 bg-white shadow-sm">
        <table class="min-w-full divide-y divide-slate-200 text-sm">
            <thead class="bg-slate-50">
            <tr>
                <th scope="col" class="px-4 py-3 text-left font-semibold text-slate-600">Employé</th>
                <th scope="col" class="px-4 py-3 text-left font-semibold text-slate-600">Type</th>
                <th scope="col" class="px-4 py-3 text-left font-semibold text-slate-600">Période</th>
                <th scope="col" class="px-4 py-3 text-left font-semibold text-slate-600">Statut</th>
                <th scope="col" class="px-4 py-3 text-left font-semibold text-slate-600">Par</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="d : ${traitees}">
                <td class="px-4 py-3 text-slate-900" th:text="${d.employe.user.prenom + ' ' + d.employe.user.nom}"></td>
                <td class="px-4 py-3 text-slate-600" th:text="${d.type.libelle}"></td>
                <td class="px-4 py-3 text-slate-600" th:text="${d.periode}"></td>
                <td class="px-4 py-3">
                    <span th:replace="~{fragments/statut-demande :: statut(${d})}"></span>
                    <p th:if="${d.motifRefus != null}" class="mt-1 text-xs text-slate-500" th:text="'Motif : ' + ${d.motifRefus}"></p>
                </td>
                <td class="px-4 py-3 text-slate-500"
                    th:text="${d.validateur != null ? d.validateur.user.prenom + ' ' + d.validateur.user.nom : '—'}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</div>
</body>
</html>
