<!-- Badge d'absence, une couleur par type. enAttente = true : demande pas encore validée (bordure pointillée).
     Les classes sont écrites en entier pour que Tailwind les génère. -->
<th:block th:fragment="badge(demande, enAttente)" th:switch="${demande.type.name()}">
    <span th:case="'CONGE_PAYE'" class="inline-block rounded-full bg-emerald-100 px-2 py-0.5 text-xs font-medium text-emerald-800"
          th:classappend="${enAttente} ? 'border border-dashed border-emerald-500 bg-white'"
          th:text="${demande.type.libelle + (enAttente ? ' (en attente)' : '')}"></span>
    <span th:case="'MALADIE'" class="inline-block rounded-full bg-rose-100 px-2 py-0.5 text-xs font-medium text-rose-800"
          th:classappend="${enAttente} ? 'border border-dashed border-rose-500 bg-white'"
          th:text="${demande.type.libelle + (enAttente ? ' (en attente)' : '')}"></span>
    <span th:case="'RTT'" class="inline-block rounded-full bg-sky-100 px-2 py-0.5 text-xs font-medium text-sky-800"
          th:classappend="${enAttente} ? 'border border-dashed border-sky-500 bg-white'"
          th:text="${demande.type.libelle + (enAttente ? ' (en attente)' : '')}"></span>
    <span th:case="'RECUP_JOUR_FERIE'" class="inline-block rounded-full bg-fuchsia-100 px-2 py-0.5 text-xs font-medium text-fuchsia-800"
          th:classappend="${enAttente} ? 'border border-dashed border-fuchsia-500 bg-white'"
          th:text="${demande.type.libelle + (enAttente ? ' (en attente)' : '')}"></span>
    <span th:case="*" class="inline-block rounded-full bg-slate-200 px-2 py-0.5 text-xs font-medium text-slate-700"
          th:classappend="${enAttente} ? 'border border-dashed border-slate-500 bg-white'"
          th:text="${demande.type.libelle + (enAttente ? ' (en attente)' : '')}"></span>
</th:block>
