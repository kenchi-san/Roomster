<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Congés payés</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="min-h-screen bg-slate-50">
<header th:replace="~{fragments/nav :: nav}"></header>

<main class="mx-auto max-w-6xl px-4 py-8">
    <h1 class="text-2xl font-bold text-slate-900">Compteurs congés payés / RTT</h1>

    <div class="mt-6 overflow-x-auto rounded-xl border border-slate-200 bg-white shadow-sm">
        <table class="min-w-full divide-y divide-slate-200 text-sm">
            <thead class="bg-slate-50">
            <tr>
                <th scope="col" rowspan="2" class="px-4 py-3 text-left font-semibold text-slate-600">Nom</th>
                <th scope="col" rowspan="2" class="px-4 py-3 text-left font-semibold text-slate-600">Prénom</th>
                <th scope="col" rowspan="2" class="px-4 py-3 text-left font-semibold text-slate-600">Poste</th>
                <th scope="col" rowspan="2" class="px-4 py-3 text-left font-semibold text-slate-600">Année</th>
                <th scope="col" colspan="3" class="px-4 py-3 text-center font-semibold text-slate-600">N</th>
                <th scope="col" colspan="3" class="px-4 py-3 text-center font-semibold text-slate-600">N-1</th>
            </tr>
            <tr>
                <th scope="col" class="px-4 py-2 text-left font-medium text-slate-500">Solde CP</th>
                <th scope="col" class="px-4 py-2 text-left font-medium text-slate-500">Solde RTT</th>
                <th scope="col" class="px-4 py-2 text-left font-medium text-slate-500">Heures sup.</th>
                <th scope="col" class="px-4 py-2 text-left font-medium text-slate-500">Solde CP</th>
                <th scope="col" class="px-4 py-2 text-left font-medium text-slate-500">Solde RTT</th>
                <th scope="col" class="px-4 py-2 text-left font-medium text-slate-500">Heures sup.</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="c : ${compteur}" class="hover:bg-slate-50">
                <td class="px-4 py-3 text-slate-900" th:text="${c.nom}"></td>
                <td class="px-4 py-3 text-slate-900" th:text="${c.prenom}"></td>
                <td class="px-4 py-3 text-slate-600" th:text="${c.poste}"></td>
                <td class="px-4 py-3 text-slate-600" th:text="${c.annee}"></td>
                <td class="px-4 py-3 text-slate-600" th:text="${c.soldeCongesPayes}"></td>
                <td class="px-4 py-3 text-slate-600" th:text="${c.soldeRtt}"></td>
                <td class="px-4 py-3 text-slate-600" th:text="${c.heuresSupCumulees}"></td>
                <td class="px-4 py-3 text-slate-400" th:text="${c.soldeCongesPayesN1} ?: '-'"></td>
                <td class="px-4 py-3 text-slate-400" th:text="${c.soldeRttN1} ?: '-'"></td>
                <td class="px-4 py-3 text-slate-400" th:text="${c.heuresSupCumuleesN1} ?: '-'"></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
