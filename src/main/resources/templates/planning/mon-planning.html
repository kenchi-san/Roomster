<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mon planning</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-slate-50">
<div class="flex min-h-screen">
<aside th:replace="~{fragments/nav :: nav}"></aside>

<main class="mx-auto max-w-4xl flex-1 px-4 py-8">
    <h1 class="text-2xl font-bold text-slate-900">Mon planning</h1>

    <div class="mt-6 flex flex-wrap items-center justify-between gap-3">
        <p class="text-sm font-medium text-slate-900"
           th:text="'Du ' + ${#temporals.format(planning.lundi, 'dd/MM/yyyy')} + ' au ' + ${#temporals.format(planning.dimanche, 'dd/MM/yyyy')}
                    + ' — ' + ${planning.totalPrevu} + ' prévues (contrat ' + ${planning.contrat} + ')'"></p>
        <div class="flex gap-2 text-sm">
            <a th:href="@{/mon-planning(semaine=${planning.semainePrecedente})}"
               class="rounded-md border border-slate-300 bg-white px-3 py-1 font-medium text-slate-700 transition hover:bg-slate-100">← Semaine précédente</a>
            <a th:href="@{/mon-planning}"
               class="rounded-md border border-slate-300 bg-white px-3 py-1 font-medium text-slate-700 transition hover:bg-slate-100">Cette semaine</a>
            <a th:href="@{/mon-planning(semaine=${planning.semaineSuivante})}"
               class="rounded-md border border-slate-300 bg-white px-3 py-1 font-medium text-slate-700 transition hover:bg-slate-100">Semaine suivante →</a>
        </div>
    </div>

    <!-- Un bloc par jour : mes horaires, puis qui travaille ce jour-là -->
    <div class="mt-4 space-y-3">
        <div th:each="jour : ${planning.jours}"
             class="rounded-xl border bg-white p-4 shadow-sm"
             th:classappend="${jour.aujourdhui} ? 'border-sky-300 ring-1 ring-sky-200' : 'border-slate-200'">
            <div class="flex flex-wrap items-center gap-2">
                <h2 class="font-semibold capitalize text-slate-900" th:text="${jour.libelle}"></h2>
                <span th:if="${jour.ferie != null}" th:text="${jour.ferie}"
                      class="rounded-full bg-violet-100 px-2 py-0.5 text-xs font-medium text-violet-800"></span>
                <span th:if="${jour.absence != null}" th:text="${jour.absence}"
                      class="rounded-full bg-sky-100 px-2 py-0.5 text-xs font-medium text-sky-800"></span>
            </div>

            <div class="mt-2">
                <p th:if="${jour.mesCreneaux.isEmpty() and jour.absence == null}" class="text-sm text-slate-400">Repos</p>
                <p th:each="creneau : ${jour.mesCreneaux}" th:text="${creneau}" class="text-sm font-medium text-slate-900"></p>
            </div>

            <div th:unless="${jour.collegues.isEmpty()}" class="mt-3 border-t border-slate-100 pt-2">
                <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Travaillent aussi ce jour-là</p>
                <p th:each="collegue : ${jour.collegues}" th:text="${collegue}" class="mt-1 text-sm text-slate-600"></p>
            </div>

            <div th:unless="${jour.absents.isEmpty()}" class="mt-3 border-t border-slate-100 pt-2">
                <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Absents ce jour-là</p>
                <p th:each="absent : ${jour.absents}" th:text="${absent}" class="mt-1 text-sm text-slate-500"></p>
            </div>
        </div>
    </div>
</main>
</div>
</body>
</html>
