server:
  port: 8099

spring:
  application:
    name: Roomster
  datasource:
    url: jdbc:h2:file:./data/roomster;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  # Sert les templates/CSS/JS directement depuis les sources : les changements
  # sont visibles au simple F5, sans recompilation ni restart devtools.
  # A retirer/déplacer derrière un profil "dev" avant de packager un jar de prod.
  thymeleaf:
    prefix: file:src/main/resources/templates/
  web:
    resources:
      static-locations: file:src/main/resources/static/
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
